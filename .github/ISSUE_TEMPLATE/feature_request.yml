name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: input
    id: env
    attributes:
      label: Editor and OS
      placeholder: Cursor on Windows, Remote-SSH to Linux
